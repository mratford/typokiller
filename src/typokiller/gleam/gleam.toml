# The pre-made project that typokiller builds and runs each Gleam code block of a Lesson in.
# The libraries are the ones that the Lesson prompt names; manifest.toml pins their versions.
name = "lesson"
version = "1.0.0"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
