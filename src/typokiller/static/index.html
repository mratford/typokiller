<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typokiller</title>
<style>
:root { --bg: #fbfaf7; --fg: #23221f; --next: #2456a6; }
@media (prefers-color-scheme: dark) { :root { --bg: #16171a; --fg: #e8e6e1; --next: #7fb0ff; } }
body { margin: 0; padding: 40vh 24px 0; text-align: center; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
a { color: var(--next); }
</style>
</head>
<body>
<!-- The typing page runs on port 3100 of the same computer (ADR 0006). -->
<p>Typing has moved to <a id="typing" href="http://localhost:3100/">the typing page</a>.</p>
<script>document.getElementById('typing').hostname = location.hostname;</script>
</body>
</html>
