<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typokiller</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #23221f; --dim: #a29e94; --faint: #d9d5cc; --bad: #c62828; --badbg: #fde4e4;
  --line: #e5e1d8; --panel: #ffffff; --next: #2456a6; --ring: #2f8a4c;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --fg: #e8e6e1; --dim: #75726b; --faint: #3a3a3d; --bad: #ff7070; --badbg: #3d1f23;
    --line: #2d2e33; --panel: #1f2024; --next: #7fb0ff; --ring: #6fcf8f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
kbd { font: 12px var(--mono); border: 1px solid var(--faint); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
#app { height: 100vh; display: flex; flex-direction: column; }
main {
  flex: 1; display: flex; flex-direction: column; justify-content: safe center; max-width: 760px; margin: 0 auto; width: 100%;
  padding: 0 24px 60px; overflow: hidden; position: relative; /* scrolled by scrollToCursor() */
}
.p { font-family: var(--mono); font-size: 21px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.p .ok { color: var(--dim); }
.p .bad { color: var(--bad); background: var(--badbg); border-radius: 2px; }
.p .cur { box-shadow: inset 0 -2px 0 var(--fg); }
.p.next { font-size: 15px; color: var(--faint); margin-top: 32px; }
.heading { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--dim); } /* a Lesson's heading, not typed */
/* While the Keymap is drawn: the heading line is one line high, also when empty, and the Passage is
   seen through a box --lines lines high, which does not shrink when the browser window is short. */
.heading.line { min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lines { height: calc(var(--lines) * 1lh); overflow: hidden; flex: none; }
.drawing { width: min(620px, 100%); margin: 0 auto 16px; opacity: .45; } /* the faint Keymap drawing, in main under the Passage */
.drawing svg { display: block; width: 100%; height: auto; }
.menu { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 24px; }
h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 24px; }
.item { display: flex; gap: 8px; padding: 1px 4px; border-radius: 4px; }
.item.sel { background: var(--faint); }
.item.faded { opacity: .35; } /* a list item whose label does not start with the typed letter */
kbd .typed { color: var(--dim); }
.item .key { color: var(--dim); } /* a setting's name in the settings file, after its label */
.hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
.status { display: flex; border-top: 1px solid var(--line); font: 13px var(--mono); color: var(--dim); }
.status span { padding: 3px 12px; white-space: nowrap; }
.status .mode { color: var(--fg); }
.status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } /* a long title is cut short, so the items after it stay visible */
.msg { height: 24px; padding: 2px 12px; font: 13px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[hidden] { display: none !important; }
/* The progress page (progress.js) */
#progress { height: 100vh; overflow-y: auto; max-width: 1100px; margin: 0 auto; padding: 16px 24px; }
#progress .tabs { display: flex; gap: 16px; margin: 16px 0 8px; color: var(--dim); }
#progress .tabs .on { color: var(--fg); font-weight: 600; }
#progress .split { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 24px; align-items: start; }
#progress .heat svg { display: block; width: 100%; height: auto; }
#progress #trend svg { max-width: 100%; height: auto; } /* the charts get smaller in a narrow window */
#progress .arc:not(.on) { display: none; } /* only the selected pair's arc */
#progress table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
#progress td { padding: 1px 8px 1px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
#progress td + td { text-align: right; color: var(--dim); }
#progress tr.sel td { background: var(--faint); color: var(--fg); }
.mono { font-family: var(--mono); }
</style>
</head>
<body>
<div id="app"></div>
<div id="progress" hidden></div>
<script type="module" src="practice.js"></script>
</body>
</html>
