<!DOCTYPE html>
<!-- PROTOTYPE for #81, throwaway. Four variants of where keybr's practice page shows
     typokiller's keyboard picture, switched with ?variant=A|B|C|D or the arrow keys.
     The Sweep pictures are drawn by typokiller's drawing.py (see gen.py). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #81: keyboard picture in keybr</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #23221f; --dim: #a29e94; --faint: #d9d5cc;
  --line: #e5e1d8; --panel: #ffffff; --next: #2456a6; --ring: #2f8a4c;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f4f4f4; color: #222; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
/* keybr-like page */
.topbar { display: flex; gap: 22px; align-items: center; padding: 10px 24px; background: #fff; border-bottom: 1px solid #ddd; }
.topbar b { font-size: 18px; margin-right: 16px; }
.topbar span { color: #555; }
.topbar .on { color: #000; font-weight: 600; }
.topbar .right { margin-left: auto; color: #2456a6; text-decoration: underline; }
.screen { width: min(900px, 100vw - 32px); margin: 0 auto; padding: 24px 0 140px; }
.indicators { display: flex; gap: 28px; font-size: 13px; color: #555; }
.indicators b { color: #000; font-size: 15px; }
.keyset { margin-top: 8px; font-size: 13px; color: #555; }
.keyset span { display: inline-block; width: 20px; text-align: center; margin-right: 2px; border-radius: 3px; background: #dfe9dc; color: #000; }
.keyset span.focus { background: #f7d58b; }
.text { margin-top: 36px; font: 30px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .02em; background: #fff; padding: 22px 28px; border-radius: 6px; white-space: pre-wrap; }
.text .done { color: #9a9a9a; }
.text .cur { background: #222; color: #fff; }
.text .cur.miss { background: #c33; }
.text.compact { margin-inline: max(-60px, 16px - (100vw - 100%) / 2); }
.text.bare { margin-inline: max(-120px, 16px - (100vw - 100%) / 2); margin-top: 110px; }
.slot { margin-top: 32px; }
.controls { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
.controls button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
.controls button.on { background: #e8eefb; border-color: #2456a6; }
.recording { margin-top: 18px; display: flex; gap: 18px; justify-content: center; font-size: 13px; color: #555; }
.recording select { font: inherit; font-size: 13px; }
.recording .dot { color: #2f8a4c; }
/* keybr's own matrix picture (standard matrix, base layer of the 30 keys, as keybr draws it) */
.matrix { background: #fff; border-radius: 6px; padding: 16px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; width: min(640px, 100%); margin: 0 auto; }
.matrix div { height: 48px; border: 1px solid #bbb; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 17px; position: relative; background: #fafafa; }
.matrix div.gap { border: none; background: none; }
.matrix div.next::after { content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #2456a6; }
.matrix div.down { background: #c9d6f2; }
.matrix .zone0 { background: #fbe3e3; } .matrix .zone1 { background: #fbf0d9; } .matrix .zone2 { background: #e2f2df; } .matrix .zone3 { background: #dfeaf7; }
/* typokiller's picture */
.sweep svg { display: block; width: 100%; height: auto; }
.sweep .keymap .pressed rect { fill: var(--faint); }
.sweep.full { width: min(760px, 100%); margin: 0 auto; background: #fff; border-radius: 6px; padding: 10px 16px; }
.sweep.faint { width: min(620px, 100%); margin: 14px auto 0; opacity: .45; }
.tabs { display: flex; gap: 16px; justify-content: center; font-size: 13px; color: #999; margin-bottom: 4px; }
.tabs .on { color: #000; font-weight: 600; border-bottom: 2px solid #2456a6; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; background: #fff; border-radius: 6px; padding: 12px; }
.grid figure { margin: 0; opacity: .3; transition: opacity .15s; }
.grid figure.on { opacity: 1; }
.grid figcaption { font-size: 12px; text-align: center; color: #555; }
.grid figure.on figcaption { font-weight: 600; color: #000; }
.pop { height: 320px; margin-top: 14px; overflow: hidden; }
.pop .sweep.faint { opacity: .8; margin-top: 0; }
.pop .name { text-align: center; font-size: 13px; color: #555; }
/* prototype only: notes and the switcher */
.notes { position: fixed; bottom: 70px; left: 12px; width: 250px; opacity: .92; background: #fffbe6; border: 1px dashed #c9a400; padding: 10px 12px; font-size: 12px; border-radius: 6px; }
.notes h4 { margin: 0 0 6px; font-size: 12px; }
.notes ul { margin: 6px 0; padding-left: 16px; }
.notes label { display: block; margin-top: 6px; }
.switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; padding: 8px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); font-size: 14px; z-index: 9; }
.switcher button { background: #333; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<div class="topbar"><b>keybr.com</b><span class="on">Practice</span><span>Multiplayer</span><span>Typing test</span><span>Profile</span><span>Settings</span><span class="right">analysis</span></div>
<div class="screen" id="screen"></div>
<div class="notes" id="notes"></div>
<div class="switcher"><button id="prev">&larr;</button><span id="label"></span><button id="next">&rarr;</button></div>
<script>
const DATA = /*DATA*/;

const VARIANTS = {
  A: { name: 'In place of keybr’s picture',
       rules: ['The Sweep picture takes the place of keybr’s own picture when a keyboard is chosen for recording.',
               'It shows the layer of the next character. Layer names above it.',
               'On/off: keybr’s own “change view” button. The normal view has the picture, compact and bare do not.'] },
  B: { name: 'Faint under the text, both pictures',
       rules: ['The faint Sweep picture is right under the text, as in typokiller. keybr’s own picture stays below it.',
               'It shows the layer of the next character.',
               'On/off: a new “keyboard picture” button next to keybr’s buttons. It also shows in the compact view.'] },
  C: { name: 'Every layer at once',
       rules: ['Small pictures of every layer take the place of keybr’s own picture.',
               'The layer of the next character is dark, the others are faint.',
               'On/off: a check box in keybr’s settings page (not drawn here).'] },
  D: { name: 'Only when another layer is needed',
       rules: ['keybr’s own picture stays. Under the text, the Sweep picture shows only when the next character is not on the base layer.',
               'Then it shows that layer, with its name.',
               'On/off: none. It shows whenever a keyboard is chosen for recording.'] },
};
const KEYS = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let variant = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';
let lessonKind = params.get('text') === 'symbols' ? 'symbols' : 'letters';

const LESSONS = {
  letters: ['tensile ratio sin unreal tine stain retail lineal toast', 'senior tile rants nest oil lane stern tail iris sore'],
  symbols: ['Tears, 12 rain-lines; (it’s 3:40) set #5 = "a".', 'Ask Ian: [2 + 7] * 8 = 72? Not 10% off, $40!'],
};
let lessonIndex = 0, text = '', pos = 0, miss = false, view = 'normal', pictureOn = true, pressed = null;

// keybr's free-range matrix: the 30 main keys by their QWERTY code, then the thumb key.
const MATRIX = [
  ['KeyQ','x'],['KeyW','p'],['KeyE','d'],['KeyR','g'],['KeyT','v'],['KeyY','k'],['KeyU','l'],['KeyI','i'],['KeyO','o'],['KeyP',"'"],
  ['KeyA','u'],['KeyS','n'],['KeyD','t'],['KeyF','s'],['KeyG','m'],['KeyH',','],['KeyJ','r'],['KeyK','e'],['KeyL','a'],['Semicolon','_'],
  ['KeyZ','z'],['KeyX','w'],['KeyC','b'],['KeyV','c'],['KeyB','f'],['KeyN','j'],['KeyM','h'],['Comma','y'],['Period','.'],['Slash','q'],
];
let downCode = null;

function newLesson() {
  const list = LESSONS[lessonKind];
  text = list[lessonIndex++ % list.length]; pos = 0; miss = false;
}
const nextChar = () => text[pos];
const nextKey = () => DATA.keys[nextChar()] ?? null;  // {layer, key}
const nextLayer = () => nextKey()?.layer ?? 0;
const keyOf = c => DATA.keys[c]?.key;

function textHTML() {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const cls = view === 'normal' ? '' : view;
  const cur = text[pos] === ' ' ? '␣' : esc(text[pos] ?? '');
  return `<div class="text ${cls}"><span class="done">${esc(text.slice(0, pos))}</span>`
    + `<span class="cur ${miss ? 'miss' : ''}">${cur}</span>${esc(text.slice(pos + 1))}</div>`;
}

function matrixHTML() {
  const next = nextChar()?.toLowerCase();
  const cells = MATRIX.map(([code, ch], i) => {
    const zone = 'zone' + [0,1,2,3,3,3,3,2,1,0][i % 10];
    const isNext = next === ch || (next === '-' && ch === '_') ? ' next' : '';
    const down = downCode === code ? ' down' : '';
    return `<div class="${zone}${isNext}${down}">${ch}</div>`;
  }).join('');
  const thumbNext = nextChar() === ' ' ? ' next' : '';
  const thumbDown = downCode === 'Space' ? ' down' : '';
  return `<div class="matrix">${cells}${'<div class="gap"></div>'.repeat(5)}<div class="${thumbNext}${thumbDown}">␣</div>${'<div class="gap"></div>'.repeat(4)}</div>`;
}

function sweepHTML(cls, layer) {
  return `<div class="sweep ${cls}" data-layer="${layer}">${DATA.layers[layer]}</div>`;
}
function tabsHTML(layer) {
  return `<div class="tabs">${DATA.names.map((n, i) => `<span class="${i === layer ? 'on' : ''}">${n}</span>`).join('')}</div>`;
}

function controlsHTML(extra = '') {
  return `<div class="controls"><button>⟲ reset lesson</button><button>⇥ skip lesson</button>`
    + `<button id="view">▭ change view (${view})</button>${extra}<button>? help</button></div>`;
}
function recordingHTML() {
  return `<div class="recording"><span>Keyboard <select><option>Sweep</option><option>Sofle</option><option>Q4</option></select></span>`
    + `<span>Layout <select><option>free-range · 3f9a12bc</option><option>QWERTY · 9c01d7e2</option></select></span>`
    + `<span class="dot">● recording</span></div>`;
}

function indicatorsHTML() {
  if (view === 'bare') return '';
  const keys = 'etaoinsrludmcgp'.split('').map((c, i) => `<span class="${i === 9 ? 'focus' : ''}">${c}</span>`).join('');
  return `<div class="indicators"><span>Speed <b>41.8wpm</b> +0.6</span><span>Accuracy <b>96.9%</b></span><span>Score <b>3,412</b></span><span>Lessons <b>212</b></span></div>`
    + `<div class="keyset">All keys: ${keys}</div>`;
}

function render() {
  const layer = nextLayer();
  let body = indicatorsHTML() + textHTML();
  if (variant === 'A') {
    if (view === 'normal') body += `<div class="slot">${tabsHTML(layer)}${sweepHTML('full', layer)}</div>`;
    body += controlsHTML();
  } else if (variant === 'B') {
    if (pictureOn && view !== 'bare') body += sweepHTML('faint', layer);
    if (view === 'normal') body += `<div class="slot">${matrixHTML()}</div>`;
    body += controlsHTML(`<button id="pic" class="${pictureOn ? 'on' : ''}">keyboard picture ${pictureOn ? 'on' : 'off'}</button>`);
  } else if (variant === 'C') {
    if (view === 'normal') {
      body += `<div class="slot grid">${DATA.names.map((n, i) =>
        `<figure class="${i === layer ? 'on' : ''}"><figcaption>${n}</figcaption>${sweepHTML('', i)}</figure>`).join('')}</div>`;
    }
    body += controlsHTML();
  } else if (variant === 'D') {
    body += `<div class="pop">${layer ? `<div class="name">${DATA.names[layer]} layer</div>${sweepHTML('faint', layer)}` : ''}</div>`;
    if (view === 'normal') body += `<div class="slot" style="margin-top:0">${matrixHTML()}</div>`;
    body += controlsHTML();
  }
  body += recordingHTML();
  document.getElementById('screen').innerHTML = body;
  // Outline the next key and shade the key just typed, in each drawn layer.
  const nk = nextKey();
  document.querySelectorAll('.sweep').forEach(el => {
    if (nk && Number(el.dataset.layer) === nk.layer) el.querySelector(`[id="k${nk.key}"]`)?.classList.add('next');
    if (pressed) el.querySelector(`[id="k${pressed}"]`)?.classList.add('pressed');
  });
  document.getElementById('view').onclick = () => {
    view = { normal: 'compact', compact: 'bare', bare: 'normal' }[view]; render();
  };
  const pic = document.getElementById('pic');
  if (pic) pic.onclick = () => { pictureOn = !pictureOn; render(); };
  const v = VARIANTS[variant];
  document.getElementById('label').textContent = `${variant} (${v.name})`;
  document.getElementById('notes').innerHTML = `<h4>PROTOTYPE · ${variant}: ${v.name}</h4><ul>${v.rules.map(r => `<li>${r}</li>`).join('')}</ul>`
    + `<div>Next character: <b>${nextChar() === ' ' ? 'space' : nextChar()}</b> on layer <b>${DATA.names[layer]}</b> · view: <b>${view}</b></div>`
    + `<label><input type="radio" name="t" value="letters" ${lessonKind === 'letters' ? 'checked' : ''}> lesson with letters only</label>`
    + `<label><input type="radio" name="t" value="symbols" ${lessonKind === 'symbols' ? 'checked' : ''}> lesson with capitals, punctuation and digits</label>`
    + `<div style="margin-top:6px;color:#777">Type on your keyboard. &larr; &rarr; change the variant.</div>`;
  document.querySelectorAll('input[name=t]').forEach(r => r.onchange = () => {
    lessonKind = r.value; lessonIndex = 0; newLesson(); setParam('text', lessonKind); r.blur(); render();
  });
}

function setParam(k, v) { params.set(k, v); history.replaceState(null, '', '?' + params); }
function go(step) {
  variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length];
  setParam('variant', variant); render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { go(-1); return; }
  if (e.key === 'ArrowRight') { go(1); return; }
  if (e.metaKey || e.ctrlKey || e.key.length !== 1) return;
  e.preventDefault();
  downCode = e.code;
  pressed = keyOf(e.key) ?? null;
  if (e.key === text[pos]) { pos++; miss = false; if (pos >= text.length) newLesson(); }
  else miss = true;
  render();
});
document.addEventListener('keyup', () => { downCode = null; pressed = null; render(); });

newLesson();
render();
</script>
</body>
</html>
