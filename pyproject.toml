[project]
name = "typokiller"
version = "0.1.0"
description = "Keyboards and their layouts, and the analysis of keybr's recordings"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "altair>=6.3.0",
    "fastapi>=0.162.0",
    "polars>=2.1.0",
    "tomlkit>=0.15.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
typokiller = "typokiller.app:main"
typokiller-service = "typokiller.service:main"
typokiller-export-keyboards = "typokiller.keyboard_export:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "marimo>=0.25.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

# keybr/ holds keybr's code; the Python tools check only typokiller's own folders.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "notebooks"]
