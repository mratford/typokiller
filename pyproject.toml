[project]
name = "typokiller"
version = "0.1.0"
description = "A personal typing trainer that records every key event"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "tomlkit>=0.15.2",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
typokiller = "typokiller.app:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]
