<title>Lesson Bake-off</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control strip on top, then one scrolling column per model, like four editor panes side by side. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2130; --muted: #5d6679; --line: #dde1e8;
  --accent: #2b4fd8; --accent-soft: #e6ebfd; --code-bg: #f0f2f6;
  --pass: #17794a; --pass-soft: #e2f4ea; --warn: #9a6200; --warn-soft: #fbf0d9;
  --fail: #b42b2b; --fail-soft: #fbe5e5;
  --ui: "Instrument Sans", system-ui, sans-serif;
  --prose: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141b; --panel: #181c25; --fg: #e4e7ee; --muted: #9aa3b5; --line: #2a303c;
  --accent: #8ea4ff; --accent-soft: #252d4a; --code-bg: #10131a;
  --pass: #5fd394; --pass-soft: #163325; --warn: #f0b44d; --warn-soft: #3a2c12;
  --fail: #ff8a8a; --fail-soft: #3d1a1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11141b; --panel: #181c25; --fg: #e4e7ee; --muted: #9aa3b5; --line: #2a303c;
  --accent: #8ea4ff; --accent-soft: #252d4a; --code-bg: #10131a;
  --pass: #5fd394; --pass-soft: #163325; --warn: #f0b44d; --warn-soft: #3a2c12;
  --fail: #ff8a8a; --fail-soft: #3d1a1d; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.wrap { display: flex; flex-direction: column; gap: 14px; height: 100%; box-sizing: border-box;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-size: 1.15rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.85rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 4px; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 4px; align-self: center; }
button.chip { font: 500 0.82rem var(--ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button.chip:focus-visible, button.reveal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 0.7rem var(--mono); color: var(--muted); margin-left: 4px; }
.toggle { display: flex; gap: 6px; align-items: center; font-size: 0.85rem; }
.grid { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr); } html, body { height: auto; } .pane { max-height: 80vh; } }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.pane-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pane-title strong { font-size: 0.95rem; }
button.reveal { font: 0.75rem var(--ui); color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pills { display: flex; gap: 3px; flex-wrap: wrap; }
.pill { width: 18px; height: 6px; border-radius: 3px; }
.pill.pass { background: var(--pass); } .pill.warn { background: var(--warn); } .pill.fail { background: var(--fail); }
.body { overflow-y: auto; padding: 4px 16px 20px; font-family: var(--prose); font-size: 0.95rem; line-height: 1.55; min-width: 0; }
.body h1, .body h2, .body h3 { font-family: var(--ui); line-height: 1.25; text-wrap: balance; }
.body h1 { font-size: 1.2rem; } .body h2 { font-size: 1.02rem; } .body h3 { font-size: 0.95rem; }
.body p, .body li { max-width: 65ch; }
.body :not(pre) > code { font: 0.84em var(--mono); background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.block { margin: 14px 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.block-head { font: 500 0.72rem var(--ui); padding: 4px 10px; display: flex; gap: 6px; align-items: center; }
.block.pass .block-head { background: var(--pass-soft); color: var(--pass); }
.block.warn .block-head { background: var(--warn-soft); color: var(--warn); }
.block.fail .block-head { background: var(--fail-soft); color: var(--fail); }
.block pre { margin: 0; padding: 10px 12px; background: var(--code-bg); overflow-x: auto; font: 0.78rem/1.5 var(--mono); }
.block details { border-top: 1px solid var(--line); }
.block summary { font: 0.72rem var(--ui); color: var(--muted); padding: 4px 10px; cursor: pointer; }
.block details pre { background: var(--panel); color: var(--muted); font-size: 0.7rem; }
.summary { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .body { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header>
    <h1>Lesson Bake-off</h1>
    <span class="sub">Same prompt, 4 models, 6 topics, 2 languages. Every code block was compiled and run with gleam 1.18.1 or Python 3.14.</span>
  </header>
  <div class="controls">
    <div class="group" id="langs"><span class="label">Language</span></div>
    <div class="group" id="topics"><span class="label">Topic</span></div>
    <label class="toggle"><input type="checkbox" id="blind"> Blind: hide and shuffle model names</label>
  </div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*DATA*/null;
const state = { lang: "gleam", topic: Object.keys(DATA.topics)[0], blind: false, revealed: new Set() };
try { Object.assign(state, JSON.parse(localStorage.getItem("bakeoff") || "{}"), { revealed: new Set() }); } catch {}
const save = () => { try { localStorage.setItem("bakeoff", JSON.stringify({ lang: state.lang, topic: state.topic, blind: state.blind })); } catch {} };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const find = (m, l, t) => DATA.lessons.find(x => x.model === m && x.lang === l && x.topic === t);
const status = b => b.runs ? "pass" : b.compiles ? "warn" : "fail";
const statusText = b => b.runs ? "Compiles and runs" : b.compiles ? "Compiles, fails to run" : "Does not compile";

function firstError(e) {
  const m = e.match(/^error: .*$/m);
  return m ? m[0] : e.split("\n").filter(Boolean).slice(-1)[0] || "";
}

function render(lesson) {
  let i = 0;
  const renderer = new marked.Renderer();
  renderer.code = (code, info) => {
    const tag = (info || "").split(/\s/)[0].toLowerCase();
    const b = tag === lesson.lang ? lesson.blocks[i++] : null;
    const cls = b ? status(b) : "";
    const head = b ? `<div class="block-head">Block ${i} &middot; ${statusText(b)}</div>` : "";
    const err = b && b.error ? `<details><summary>${esc(firstError(b.error))}</summary><pre>${esc(b.error)}</pre></details>` : "";
    return `<div class="block ${cls}">${head}<pre><code>${esc(code)}</code></pre>${err}</div>`;
  };
  return marked.parse(lesson.text, { renderer });
}

function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
function order() {
  const ms = DATA.models.slice();
  if (!state.blind) return ms;
  return ms.sort((a, b) => hash(state.topic + state.lang + a.id) - hash(state.topic + state.lang + b.id));
}

function draw() {
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", el.dataset.lang === state.lang);
  for (const el of document.querySelectorAll("[data-topic]")) el.setAttribute("aria-pressed", el.dataset.topic === state.topic);
  document.getElementById("blind").checked = state.blind;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  order().forEach((m, n) => {
    const l = find(m.id, state.lang, state.topic);
    const hidden = state.blind && !state.revealed.has(m.id);
    const name = hidden ? `Model ${"ABCD"[n]}` : m.name;
    const pane = document.createElement("section");
    pane.className = "pane";
    const ok = l.blocks.filter(b => b.runs).length;
    pane.innerHTML = `
      <div class="pane-head">
        <div class="pane-title"><strong>${name}</strong>${hidden ? `<button class="reveal" data-reveal="${m.id}">Reveal</button>` : ""}</div>
        <div class="stats"><span>${ok}/${l.blocks.length} blocks pass</span><span>${l.words} words</span>
          ${hidden ? "" : `<span>$${l.cost.toFixed(4)}</span><span>${Math.round(l.seconds)} s</span>`}</div>
        <div class="pills">${l.blocks.map(b => `<span class="pill ${status(b)}" title="${statusText(b)}"></span>`).join("")}</div>
      </div>
      <div class="body">${render(l)}</div>`;
    grid.appendChild(pane);
  });
  for (const b of grid.querySelectorAll("[data-reveal]")) b.onclick = () => { state.revealed.add(b.dataset.reveal); draw(); };
  drawSummary();
}

function drawSummary() {
  const el = document.getElementById("summary");
  if (state.blind) { el.innerHTML = ""; return; }
  const rows = DATA.models.map(m => {
    const cells = Object.keys(DATA.langs).map(l => {
      const ls = DATA.lessons.filter(x => x.model === m.id && x.lang === l);
      const blocks = ls.flatMap(x => x.blocks);
      const ok = blocks.filter(b => b.runs).length;
      const all = ls.filter(x => x.blocks.length && x.blocks.every(b => b.runs)).length;
      const cost = ls.reduce((s, x) => s + x.cost, 0) / ls.length;
      return `<td>${ok}/${blocks.length} (${Math.round(100 * ok / blocks.length)}%)</td><td>${all}/${ls.length}</td><td>$${cost.toFixed(4)}</td>`;
    }).join("");
    return `<tr><td>${m.name}</td>${cells}</tr>`;
  }).join("");
  const heads = Object.values(DATA.langs).map(n => `<th>${n} blocks pass</th><th>${n} Lessons all-pass</th><th>${n} mean cost</th>`).join("");
  el.innerHTML = `<table><tr><th>Model</th>${heads}</tr>${rows}</table>`;
}

function chips() {
  const langs = document.getElementById("langs"), topics = document.getElementById("topics");
  Object.entries(DATA.langs).forEach(([k, name]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.lang = k; b.innerHTML = `${name}<kbd>${name[0].toLowerCase()}</kbd>`;
    b.onclick = () => { state.lang = k; save(); draw(); };
    langs.appendChild(b);
  });
  Object.entries(DATA.topics).forEach(([k, name], i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.topic = k; b.innerHTML = `${name}<kbd>${i + 1}</kbd>`;
    b.onclick = () => { state.topic = k; save(); draw(); };
    topics.appendChild(b);
  });
  document.getElementById("blind").onchange = e => { state.blind = e.target.checked; state.revealed.clear(); save(); draw(); };
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const keys = Object.keys(DATA.topics);
    if (/^[1-9]$/.test(e.key) && keys[e.key - 1]) state.topic = keys[e.key - 1];
    else if (e.key === "g") state.lang = "gleam";
    else if (e.key === "p") state.lang = "python";
    else if (e.key === "b") { state.blind = !state.blind; state.revealed.clear(); }
    else return;
    save(); draw();
  });
}

chips();
draw();
</script>
